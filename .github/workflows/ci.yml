name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/wo_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-for-tests-only-0123456789
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Instal dependensi API & web
        run: |
          npm --prefix apps/api ci
          npm --prefix apps/web ci
      - name: Prisma generate + migrasi DB uji
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
      - name: Typecheck API & web
        run: |
          (cd apps/api && npx tsc --noEmit -p .)
          (cd apps/web && npx tsc --noEmit -p .)
      - name: Tes API
        working-directory: apps/api
        run: npm test
      - name: Tes skrip server (docker tiruan)
        run: |
          bash scripts/tests/app-route.test.sh
          bash scripts/tests/garage.test.sh
      - name: Sintaks skrip .sh
        run: for f in scripts/*.sh; do bash -n "$f" || exit 1; done
